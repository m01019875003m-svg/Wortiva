<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wortiva - كلمات Netzwerk</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <header class="topbar">

        <div class="logo">
            Wortiva
        </div>

        <div class="page-nav">

            <button
                onclick="window.location.href='index.html'">

                🏠 الرئيسية

            </button>

            <button
                onclick="window.location.href='search.html'">

                🔎 البحث

            </button>

            <button
                onclick="window.location.href='favorites.html'">

                ⭐ المفضلة

            </button>

        </div>

    </header>


    <main class="container">

        <section class="hero">

            <p class="small-text">
                Wortiva
            </p>

            <h1>
                📚 كلمات Netzwerk
            </h1>

            <p>
                اختر مستوى Netzwerk لعرض Kapitel والكلمات.
            </p>

        </section>


        <section class="levels">

            <button
                class="level-card"
                data-level="A1">

                <strong>
                    Netzwerk A1
                </strong>

                <span>
                    مستوى المبتدئ
                </span>

            </button>


            <button
                class="level-card"
                data-level="A2">

                <strong>
                    Netzwerk A2
                </strong>

                <span>
                    المستوى الأساسي
                </span>

            </button>


            <button
                class="level-card"
                data-level="B1">

                <strong>
                    Netzwerk B1
                </strong>

                <span>
                    المستوى المتوسط
                </span>

            </button>


            <button
                class="level-card"
                data-level="B2">

                <strong>
                    Netzwerk B2
                </strong>

                <span>
                    فوق المتوسط
                </span>

            </button>

        </section>

    </main>


    <script src="netzwerk.js"></script>

</body>

</html>
