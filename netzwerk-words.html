<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wortiva - Netzwerk كلمات</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        Wortiva
    </div>

    <div class="page-nav">

      <button onclick="backToCategories()">
    📚 كل الفئات
</button>

        <button onclick="window.location.href='index.html'">
            🏠 الرئيسية
        </button>

    </div>

</header>


<main class="container">

    <section class="hero">

        <p class="small-text">
            Netzwerk A1
        </p>

        <h1 id="chapterTitle">
            الكلمات
        </h1>

        <p id="categoryTitle">
            الفئة
        </p>

    </section>


    <!-- الترتيب -->

    <section class="sort-box">

        <label for="sortSelect">
            🔃 ترتيب حسب
        </label>

        <select id="sortSelect">

            <option value="original">
                ترتيب الكتاب
            </option>

            <option value="german">
                الألمانية A → Z
            </option>

            <option value="arabic">
                العربية
            </option>

            <option value="type">
                النوع
            </option>

        </select>

    </section>
<section class="category-navigation">

    <button id="prevCategory">
        → السابقة
    </button>

    <span id="categoryPosition">
        الفئة
    </span>

    <button id="nextCategory">
        التالية ←
    </button>

</section>

    <!-- الكلمات -->

    <section
        id="wordsList"
        class="search-results">
    </section>

</main>


<script src="netzwerk-a1.js"></script>
<script src="netzwerk-categories.js"></script>
<script src="netzwerk-words.js"></script>

</body>

</html>
