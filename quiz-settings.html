<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wortiva - إعداد الاختبار</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

    <div class="logo">
        Wortiva
    </div>

    <div class="page-nav">

        <button onclick="window.location.href='index.html'">
            🏠 الرئيسية
        </button>

        <button onclick="window.location.href='search.html'">
            🔎 البحث
        </button>

        <button onclick="window.location.href='favorites.html'">
            ⭐ المفضلة
        </button>

    </div>

</header>


    <main class="container">

        <section class="hero">

            <p class="small-text">
                اختبار جديد
            </p>

            <h1>🧠 إعداد الاختبار</h1>

            <p>
                اختر المستوى والفئة وعدد الأسئلة.
            </p>

        </section>


        <section class="word-card">

            <h2>🎓 المستوى</h2>

            <select id="quizLevel" class="quiz-select">

                <option value="A1">A1 - مبتدئ</option>
                <option value="A2">A2 - أساسي</option>
                <option value="B1">B1 - متوسط</option>
                <option value="B2">B2 - فوق المتوسط</option>
                <option value="C1">C1 - متقدم</option>
                <option value="C2">C2 - إتقان</option>

            </select>


            <h2>📚 الفئة</h2>

            <select id="quizCategory" class="quiz-select">

                <option value="all">كل الفئات</option>

                <option value="التحيات">
                    التحيات
                </option>

                <option value="العائلة">
                    العائلة
                </option>

                <option value="المنزل">
                    المنزل
                </option>

                <option value="الطعام">
                    الطعام
                </option>

                <option value="التعليم">
                    التعليم
                </option>

                <option value="المواصلات">
                    المواصلات
                </option>

            </select>


            <h2>🔢 عدد الأسئلة</h2>

            <select id="questionCount" class="quiz-select">

                <option value="5">5 أسئلة</option>

                <option value="10">
                    10 أسئلة
                </option>

                <option value="15">
                    15 سؤال
                </option>

                <option value="20">
                    20 سؤال
                </option>

            </select>


            <p id="quizSettingsMessage"></p>


            <button
                class="primary-button"
                id="startQuizButton">

                🚀 ابدأ الاختبار

            </button>

        </section>

    </main>


    <script src="data/words.js"></script>
    <script src="quiz-settings.js"></script>

</body>

</html>
